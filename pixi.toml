[workspace]
name = "pdftotext"
version = "0.1.0"
authors = ["Marius S <marius@seritan.net>"]
description = "A from-scratch PDF-to-text extractor in Mojo. Depends on zlib.mojo for FlateDecode."
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.0.0"
# Dev inside the millfolio workspace: build the sibling checkout (mojopkg +
# zlib shim) straight into this env — no -I flags, no manual ffi step.
zlib-mojo = { path = "../zlib.mojo" }
# zlib for the FlateDecode shim (built from the sibling zlib.mojo checkout).
zlib = ">=1.3.1,<2"

[tasks]
build = { cmd = "mkdir -p build && mojo build src/main.mojo -I src -o build/pdftotext" }
test  = { cmd = "mkdir -p build && mojo build test/pdf_test.mojo -I src -o build/pdf-test && ./build/pdf-test" }
# Extract text from a PDF: pixi run extract -- path/to/file.pdf
extract = { cmd = "./build/pdftotext", depends-on = ["build"] }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is pdftotext; the Mojo import stays `from pdf import …`.
[package]
name = "pdftotext"
version = "0.1.3"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/pdf"
name = "pdf"
# Resolve mojopkg host-dependencies (zlib-mojo) from the host prefix.
extra-args = ["-I", "$PREFIX/lib/mojo"]

[package.host-dependencies]
mojo-compiler = "==1.0.0"
zlib-mojo = { git = "https://github.com/millfolio/zlib.mojo.git", rev = "f243ffab8dd7a84bce07eeced59053cc7a315e3d" }

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = "==1.0.0"
zlib-mojo = { git = "https://github.com/millfolio/zlib.mojo.git", rev = "f243ffab8dd7a84bce07eeced59053cc7a315e3d" }
